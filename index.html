.row .btn{padding:8px 10px;font-size:13px}
.lock input{background:#fff;color:#111;border:0}.lock .btn{font-size:15px}

<body>
<header><div class="brand"><b>Loyeke<i>App</i>_Pharma</b><span id="who" style="font-size:12px;color:var(--g2);margin:0 8px 0 auto"></span><button class="cur" id="cur"></button></div></header>

<script>
const KEY="loyeke_pharma_v1";
const d0=n=>{const x=new Date();x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const demo=()=>({rate:2800,cur:"USD",meds:[
{id:1,n:"Paracétamol",dci:"Paracétamol",f:"Comprimé",dos:"500 mg",p:0.1,min:200},
{id:2,n:"Amoxicilline",dci:"Amoxicilline",f:"Gélule",dos:"500 mg",p:0.35,min:100},
{id:3,n:"Coartem",dci:"Artéméther-luméfantrine",f:"Comprimé",dos:"20/120 mg",p:3.5,min:30},
{id:4,n:"Sirop Vitamine C",dci:"Acide ascorbique",f:"Sirop",dos:"125 ml",p:2,min:15}],
lots:[{id:1,m:1,no:"PCM-2401",q:850,e:d0(400),c:0.05},{id:2,m:2,no:"AMX-2307",q:60,e:d0(45),c:0.2},
{id:3,m:2,no:"AMX-2201",q:40,e:d0(-20),c:0.2},{id:4,m:3,no:"COA-2403",q:20,e:d0(200),c:2.2},{id:5,m:4,no:"VTC-2402",q:35,e:d0(120),c:1.2}]});
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.meds)S=demo();S.sales=S.sales||[];S.log=S.log||[];
S.exp=S.exp||[];S.clos=S.clos||{};S.user=S.user||"Pharmacien";S.ph=S.ph||"Ma pharmacie";S.users=S.users||[];
[[1,"Paracétamol"],[2,"Amoxicilline"],[3,"Coartem"],[4,"Sirop Vitamine C"]].forEach(([i,n])=>{const m=S.meds.find(x=>x.id===i);if(m&&m.n===n&&m.demo===undefined)m.demo=true});
S.lots.forEach(l=>{if(l.id<=5&&["PCM-2401","AMX-2307","AMX-2201","COA-2403","VTC-2402"].includes(l.no)&&l.demo===undefined)l.demo=true});
S.sales.forEach((s,i)=>{s.st=s.st||"valide";s.pay=s.pay||"Espèces";s.no=s.no||"V-"+String(S.sales.length-i).padStart(5,"0")});
const now=()=>{const t=Math.max(Date.now(),S.ts||0);S.ts=t;return new Date(t).toISOString()};
const log=(t,x,o={})=>{S.log.unshift({id:Date.now()+Math.random(),d:now(),t,x,u:S.user,uid:CU?CU.id:0,...o})};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const days=e=>Math.ceil((new Date(e)-new Date(new Date().toDateString()))/864e5);
const money=(u,c=S.cur,r=S.rate)=>c==="USD"?"$"+u.toFixed(2):Math.round(u*r).toLocaleString("fr-FR")+" FC";
const med=id=>S.meds.find(m=>m.id===id);
const sellable=m=>S.lots.filter(l=>l.m===m&&days(l.e)>=0).reduce((a,l)=>a+l.q,0);
const st=l=>{const d=days(l.e);return d<0?["Expiré","r"]:d<=90?["Péremption "+d+" j","w"]:["Valide",""]};
const fd=e=>new Date(e).toLocaleDateString("fr-FR");
let tab="home",q="",hf="",cart=[],fails=0,until=0,hiddenAt=0,cartPt="",cartPm="Espèces",hd1="",hd2="",hm="",hu="",repDay="";
const toast=m=>{const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)};
const td=x=>new Date(x).toLocaleDateString("fr-CA");
const fefo=m=>S.lots.filter(l=>l.m===m&&l.q>0&&days(l.e)>=0).sort((a,b)=>new Date(a.e)-new Date(b.e));
const PERMS={vendre:"Vendre",annuler:"Annuler / rembourser",stock:"Gérer le stock",catalogue:"Modifier le catalogue et les prix",depenses:"Enregistrer les dépenses",rapports:"Consulter les rapports",cloture:"Clôturer la caisse"},ROLES={admin:"Administrateur",pharmacien:"Pharmacien",vendeur:"Vendeur"},DEF={pharmacien:Object.keys(PERMS),vendeur:["vendre"]};
let CU=null,lf=0,lu=0;
const can=p=>!!CU&&(CU.role==="admin"||(p!=="admin"&&CU.perms.includes(p)));
const need=p=>can(p)||(toast("Permission refusée : action réservée "+(p==="admin"?"à l’administrateur":"aux utilisateurs autorisés")+"."),false);
const cv=(v,c)=>c==="CDF"?+(+v/S.rate).toFixed(6):+v;
const rsalt=()=>Array.from(crypto.getRandomValues(new Uint8Array(12)),x=>x.toString(16).padStart(2,"0")).join("");
const hp=async(pw,salt)=>{try{const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);const b=await crypto.subtle.deriveBits({name:"PBKDF2",salt:new TextEncoder().encode(salt),iterations:100000,hash:"SHA-256"},k,256);return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return H(salt+pw)}};
function authBox(title,sub,fields,btn,cb){const o=document.createElement("div");o.className="lock";o.dataset.auth=1;o.style.overflow="auto";
 o.innerHTML=`<h2>${title}</h2><p id="as">${sub}</p><div style="width:100%;max-width:320px;text-align:left">${fields.map(f=>`<label style="color:var(--g2)">${f[1]}</label><input id="a_${f[0]}" type="${f[2]||"text"}" autocomplete="off">`).join("")}<button class="btn" id="ab" style="width:100%;background:var(--g2);color:var(--g9)">${btn}</button></div>`;
 document.body.appendChild(o);
 o.querySelector("#ab").onclick=async()=>{const v={};fields.forEach(f=>v[f[0]]=o.querySelector("#a_"+f[0]).value.trim());const e=await cb(v,o);if(e)o.querySelector("#as").textContent=e};return o}
function boot(){if(!S.users.length)setupAdmin();else login()}
function setupAdmin(){authBox("Bienvenue","Créez le compte administrateur de la pharmacie. Retenez le mot de passe : il ne peut pas être récupéré.",[["u","Identifiant"],["n","Nom complet"],["p","Mot de passe (6 caractères min.)","password"],["c","Confirmer le mot de passe","password"]],"Créer le compte",async(v,o)=>{
 if(!/^[a-z0-9._-]{3,}$/i.test(v.u))return"Identifiant : 3 caractères minimum (lettres, chiffres, . _ -).";if(!v.n)return"Saisissez votre nom.";if(v.p.length<6)return"Mot de passe trop court (6 minimum).";if(v.p!==v.c)return"Les mots de passe diffèrent.";
 const sa=rsalt(),u={id:Date.now(),u:v.u.toLowerCase(),n:v.n,role:"admin",perms:Object.keys(PERMS),on:true,sa,h:await hp(v.p,sa),cr:now()};S.users.push(u);CU=u;S.user=u.n;log("Utilisateur","Compte administrateur créé : "+u.n);save();o.remove();render()})}
function login(){authBox("LoyekeApp_Pharma","Connectez-vous pour continuer",[["u","Identifiant"],["p","Mot de passe","password"]],"Se connecter",async(v,o)=>{
 if(Date.now()<lu)return"Trop d’essais. Patientez "+Math.ceil((lu-Date.now())/1000)+" s.";
 const u=S.users.find(x=>x.u===v.u.toLowerCase());
 if(!u||await hp(v.p,u.sa)!==u.h){lf++;log("Connexion","Échec de connexion : "+v.u,{u:"(inconnu)",uid:0});save();if(lf>=5){lf=0;lu=Date.now()+30000;return"Trop d’essais. Patientez 30 s."}return"Identifiant ou mot de passe incorrect."}
 if(!u.on)return"Ce compte est désactivé. Contactez l’administrateur.";
 lf=0;CU=u;S.user=u.n;u.last=now();log("Connexion","Connexion de "+u.n);save();o.remove();tab="home";render()})}
function logout(){if(CU)log("Connexion","Déconnexion de "+CU.n);save();CU=null;login()}
function pwForm(){form("Changer mon mot de passe",[{k:"o",l:"Mot de passe actuel",t:"password"},{k:"n",l:"Nouveau mot de passe (6 min.)",t:"password"},{k:"c",l:"Confirmer",t:"password"}],async r=>{if(await hp(r.o,CU.sa)!==CU.h)return"Mot de passe actuel incorrect.";if(r.n.length<6)return"6 caractères minimum.";if(r.n!==r.c)return"Les mots de passe diffèrent.";CU.sa=rsalt();CU.h=await hp(r.n,CU.sa);log("Utilisateur","Mot de passe modifié par "+CU.n)})}
function userForm(u){const n=!u;u=u||{role:"vendeur",perms:[...DEF.vendeur],on:true};
 const o=modal(`<h2>${n?"Nouvel utilisateur":"Modifier "+esc(u.n)}</h2><label>Identifiant</label><input id="fu" value="${esc(u.u||"")}" ${n?"":"readonly"}><label>Nom complet</label><input id="fn" value="${esc(u.n||"")}"><label>Rôle</label><select id="fr">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${k===u.role?"selected":""}>${v}</option>`).join("")}</select><label>${n?"Mot de passe (6 min.)":"Nouveau mot de passe (vide = inchangé)"}</label><input id="fp" type="password" autocomplete="new-password"><label>Statut</label><select id="fs"><option value="1" ${u.on?"selected":""}>Actif</option><option value="0" ${u.on?"":"selected"}>Désactivé</option></select><label>Permissions</label>${Object.entries(PERMS).map(([k,v])=>`<div class="row" style="padding:8px"><span>${v}</span><input type="checkbox" data-p="${k}" ${u.perms.includes(k)?"checked":""} style="width:22px;margin:0"></div>`).join("")}<div class="acts"><button class="btn o" id="x">Annuler</button><button class="btn" id="s">Enregistrer</button></div>`);
 const g=x=>o.querySelector(x);
 g("#fr").onchange=()=>{const r=g("#fr").value;o.querySelectorAll("[data-p]").forEach(c=>c.checked=r==="admin"||(DEF[r]||[]).includes(c.dataset.p))};
 g("#x").onclick=()=>o.remove();
 g("#s").onclick=async()=>{const id=g("#fu").value.trim().toLowerCase(),nm=g("#fn").value.trim(),role=g("#fr").value,pw=g("#fp").value,on=g("#fs").value==="1",perms=role==="admin"?Object.keys(PERMS):[...o.querySelectorAll("[data-p]")].filter(c=>c.checked).map(c=>c.dataset.p);
  if(!/^[a-z0-9._-]{3,}$/.test(id))return toast("Identifiant invalide (3 caractères min.).");if(!nm)return toast("Saisissez le nom.");
  if(n&&S.users.some(x=>x.u===id))return toast("Identifiant déjà utilisé.");
  if((n||pw)&&pw.length<6)return toast("Mot de passe : 6 caractères minimum.");
  if(!n&&u.role==="admin"&&(role!=="admin"||!on)&&!S.users.some(x=>x!==u&&x.role==="admin"&&x.on))return toast("Il faut au moins un administrateur actif.");
  if(!n&&u===CU&&!on)return toast("Vous ne pouvez pas désactiver votre propre compte.");
  const ch=[];if(!n){if(u.n!==nm)ch.push("nom");if(u.role!==role)ch.push("rôle "+ROLES[u.role]+" → "+ROLES[role]);if(u.on!==on)ch.push(on?"activé":"désactivé");if(JSON.stringify([...u.perms].sort())!==JSON.stringify([...perms].sort()))ch.push("permissions");if(pw)ch.push("mot de passe réinitialisé")}
  if(n){u={id:Date.now(),u:id,cr:now()};S.users.push(u)}
  u.n=nm;u.role=role;u.on=on;u.perms=perms;if(pw){u.sa=rsalt();u.h=await hp(pw,u.sa)}
  if(u===CU)S.user=u.n;
  log("Utilisateur",n?`Compte créé : ${nm} (${id}) — ${ROLES[role]}`:`Compte ${u.u} modifié : ${ch.join(", ")||"aucun changement"}`);save();o.remove();render()}}

function sell_old(){const al=[];let tot=0,pr=0;
 for(const c of cart){const m=med(c.m);if(!m)return"Médicament introuvable.";let r=c.q;const a=[];
  for(const l of fefo(c.m)){if(r<=0)break;const t=Math.min(l.q,r);a.push({l:l.id,no:l.no,e:l.e,q:t,c:l.c});r-=t}
  if(r>0)return`Stock insuffisant pour ${m.n} (lots valides : ${sellable(c.m)}).`;
  al.push({m:c.m,n:m.n+" "+m.dos,q:c.q,p:m.p,a});tot+=c.q*m.p;pr+=a.reduce((s,x)=>s+x.q*(m.p-x.c),0)}

 al.forEach(i=>i.a.forEach(x=>{S.lots.find(l=>l.id===x.l).q-=x.q}));
 S.sales.unshift({id:Date.now(),d:new Date().toISOString(),i:al,t:tot,pr,cur:S.cur,rate:S.rate});

const H=async p=>{try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("loyeke:"+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=5381;for(const c of "loyeke:"+p)h=(h*33^c.charCodeAt(0))>>>0;return"s"+h}};
function pad(title,sub,len,cb,cancel){const o=document.createElement("div");o.className="lock";let v="";
 o.innerHTML=`<h2>${title}</h2><p id="ls">${sub}</p><div class="dots">${"<i></i>".repeat(len)}</div><div class="pad">${[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(k=>k===""?"<span></span>":`<button data-k="${k}">${k}</button>`).join("")}</div><button class="btn o" id="lc" style="margin-top:22px;color:#fff;border-color:#fff;display:none">Annuler</button>`;
 if(cancel){const c=o.querySelector("#lc");c.style.display="";c.onclick=()=>o.remove()}
 const upd=()=>o.querySelectorAll(".dots i").forEach((d,i)=>d.classList.toggle("on",i<v.length));
 o.onclick=async e=>{const b=e.target.closest("[data-k]");if(!b)return;const k=b.dataset.k;if(k==="⌫")v=v.slice(0,-1);else if(v.length<len)v+=k;upd();if(v.length===len){const p=v;v="";await cb(p,o);upd()}};
 document.body.appendChild(o);return o}

  +(c&&c.aud.length?`<h3>Traçabilité</h3>`+c.aud.map(a=>`<div class="row"><div class="t"><b>${a.a} · ${esc(a.u)}</b><span>${new Date(a.t).toLocaleString("fr-FR")}${a.j?" · "+esc(a.j):""}</span></div></div>`).join(""):"")

 }
 if(tab==="hist"){
  const T=["Vente","Entrée","Sortie","Ajustement","Retrait","Création","Modification","Annulation","Remboursement","Dépense","Clôture","Réouverture","Sécurité","Sauvegarde","Utilisateur","Connexion","Suppression"],ms=[...new Set(S.log.map(e=>e.m).filter(Boolean))].sort();
  h=`<h2>Historique des opérations</h2><button class="btn o" id="hb" style="margin-bottom:10px">← Réglages</button><div class="grid"><div><label>Du</label><input type="date" id="h1" value="${hd1}"></div><div><label>Au</label><input type="date" id="h2" value="${hd2}"></div></div><select id="hf"><option value="">Tous les types</option>${T.map(t=>`<option ${hf===t?"selected":""}>${t}</option>`).join("")}</select>${can("admin")?`<select id="hu"><option value="">Tous les utilisateurs</option>${S.users.map(u=>`<option ${hu===u.n?"selected":""}>${esc(u.n)}</option>`).join("")}</select>`:""}<select id="hm"><option value="">Tous les médicaments</option>${ms.map(t=>`<option ${hm===t?"selected":""}>${esc(t)}</option>`).join("")}</select><p style="color:var(--mu);font-size:12px;margin:0 0 8px">Les opérations sont conservées définitivement : aucune ne peut être supprimée.</p>`;
  const L=S.log.filter(e=>(!hf||e.t===hf)&&(!hm||e.m===hm)&&(!hu||e.u===hu)&&(can("admin")||(CU&&e.uid===CU.id))&&(!hd1||td(e.d)>=hd1)&&(!hd2||td(e.d)<=hd2));
  h+=`<p style="margin:0 0 8px;color:var(--mu);font-size:13px">${L.length} opération(s)</p>`+(L.length?L.slice(0,300).map(e=>`<div class="row"><div class="t"><b>${esc(e.x)}</b><span>${new Date(e.d).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"})} · ${esc(e.u||"—")}${e.m?" · "+esc(e.m):""}${e.q!=null?" · qté "+e.q:""}${e.p!=null?" · PU "+money(e.p):""}${e.a!=null?" · "+money(e.a):""}</span></div><span class="tag ${["Annulation","Remboursement","Retrait","Réouverture"].includes(e.t)?"r":["Ajustement","Modification","Sortie","Dépense"].includes(e.t)?"w":""}">${e.t}</span></div>`).join(""):`<div class="empty">Aucune opération pour ces filtres.</div>`);
 }
 if(tab==="hist_old"){
  h=`<h2>Historique</h2><button class="btn o" id="hb" style="margin-bottom:10px">← Réglages</button><select id="hf"><option value="">Toutes les opérations</option>${["Vente","Entrée","Sortie","Retrait","Création","Modification","Sécurité","Sauvegarde"].map(t=>`<option ${hf===t?"selected":""}>${t}</option>`).join("")}</select>`;
  const L=S.log.filter(e=>!hf||e.t===hf).slice(0,100);
  h+=L.length?L.map(e=>`<div class="row"><div class="t"><b>${esc(e.x)}</b><span>${new Date(e.d).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"})}</span></div><span class="tag ${e.t==="Vente"||e.t==="Entrée"?"":e.t==="Retrait"?"r":"w"}">${e.t}</span></div>`).join(""):`<div class="empty">Aucune opération enregistrée.</div>`;
 }
 if(tab==="exp"){
  h=`<h2>Péremptions</h2><h3>Expirés (vente bloquée)</h3>`+(exp.length?exp.map(l=>`<div class="row"><div class="t"><b>${esc(med(l.m).n)} — ${l.q} u.</b><span>Lot ${esc(l.no)} · expiré le ${fd(l.e)}</span></div><button class="btn d" data-r="${l.id}">Retirer</button></div>`).join(""):`<div class="empty">Aucun lot expiré.</div>`);
  h+=`<h3>Expirent sous 90 jours</h3>`+(soon.length?soon.map(l=>`<div class="row"><div class="t"><b>${esc(med(l.m).n)} — ${l.q} u.</b><span>Lot ${esc(l.no)} · ${fd(l.e)}</span></div><span class="tag w">${days(l.e)} j</span></div>`).join(""):`<div class="empty">Aucun lot proche de la péremption.</div>`);
 }
 if(tab==="more"){
  h=`<h2>Réglages</h2><label>Taux de change (1 USD = ? CDF)</label><input id="rate" type="number" value="${S.rate}" inputmode="numeric">
  <button class="btn" id="sr">Enregistrer le taux</button>
  <h3>Mon compte</h3><p style="color:var(--mu);font-size:13px;margin:0 0 8px">${CU?esc(CU.n)+" — "+ROLES[CU.role]:""}</p><div class="acts" style="justify-content:flex-start"><button class="btn o" id="mp">Changer mon mot de passe</button><button class="btn d" id="lo">Se déconnecter</button></div>${can("admin")?`<h3>Administration</h3><button class="btn" id="ug">Utilisateurs et permissions</button>`:""}<h3>Catalogue</h3><p style="color:var(--mu);font-size:12px;margin:0 0 8px">Les prix de démonstration sont fictifs et indicatifs, jamais officiels : tous sont modifiables.</p><div class="acts" style="justify-content:flex-start;flex-wrap:wrap"><button class="btn o" id="cx">Exporter CSV</button><button class="btn o" id="ci">Importer CSV</button><button class="btn o" id="cd">Charger le catalogue de démonstration</button></div><h3>Pharmacie</h3><label>Nom de la pharmacie (sur les reçus)</label><input id="ph" value="${esc(S.ph)}"><label>Nom de l’utilisateur</label><input id="us" value="${esc(S.user)}" readonly><button class="btn" id="sv">Enregistrer</button><h3>Sécurité</h3><p style="color:var(--mu);font-size:13px;margin:0 0 10px">${S.pin?"Code PIN actif ("+S.pinLen+" chiffres).":"Aucun code PIN : l’application s’ouvre sans protection."}</p><div class="acts" style="justify-content:flex-start"><button class="btn" id="pn">${S.pin?"Changer le code PIN":"Créer un code PIN"}</button>${S.pin?`<button class="btn d" id="pd">Désactiver</button>`:""}</div>
  <h3>Historique et rapports</h3><div class="acts" style="justify-content:flex-start"><button class="btn o" id="hh">Historique des opérations</button><button class="btn" id="hr">Rapport journalier</button></div>
  <h3>Sauvegarde des données</h3><p style="color:var(--mu);font-size:13px;margin:0 0 10px">Vos données restent sur cet appareil et fonctionnent sans Internet. Copiez une sauvegarde régulièrement.</p>
  <div class="acts" style="justify-content:flex-start"><button class="btn" id="bk">Copier la sauvegarde</button><button class="btn o" id="rs">Restaurer</button></div>
  <h3>Données de démonstration</h3><p style="color:var(--mu);font-size:12px;margin:0 0 8px">Supprime les médicaments et stocks fictifs pour démarrer avec vos vraies données.</p><button class="btn d" id="rn">Réinitialiser les données de démonstration</button><button id="rz" style="display:none"></button>
  <p style="color:var(--mu);font-size:12px;margin-top:24px">LoyekeApp_Pharma v1 — gestion de stock. Aucune fonction de diagnostic ni de prescription.</p>`;
 }
 V.innerHTML=h;
 if(tab==="meds"||tab==="stock"){const f=document.createElement("button");f.className="fab";f.textContent="+";f.setAttribute("aria-label","Ajouter");f.onclick=()=>tab==="meds"?medForm():S.meds.length?lotForm():alert("Ajoutez d’abord un médicament.");document.body.appendChild(f)}
 const qi=$("#q");if(qi){qi.oninput=e=>{q=e.target.value;const p=e.target.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(p,p)}}
 V.querySelectorAll("[data-m]").forEach(r=>r.onclick=()=>medForm(med(+r.dataset.m)));
 V.querySelectorAll("[data-a]").forEach(r=>r.onclick=()=>{const id=+r.dataset.a,c=cart.find(x=>x.m===id),mx=sellable(id);if(c){if(c.q<mx)c.q++;else toast("Stock maximum atteint : "+mx)}else cart.push({m:id,q:1});render()});
 V.querySelectorAll("[data-cm]").forEach(b=>b.onclick=()=>{const c=cart.find(x=>x.m===+b.dataset.cm);c.q--;if(c.q<1)cart=cart.filter(x=>x!==c);render()});
 V.querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>{const id=+b.dataset.cp,c=cart.find(x=>x.m===id),mx=sellable(id);if(c.q<mx)c.q++;else toast("Stock maximum atteint : "+mx);render()});
 V.querySelectorAll("[data-ci]").forEach(i=>i.onchange=()=>{const id=+i.dataset.ci,c=cart.find(x=>x.m===id),mx=sellable(id);let v=Math.floor(+i.value);if(!(v>=1))v=1;if(v>mx){v=mx;toast("Stock maximum : "+mx)}c.q=v;render()});
 if($("#cc"))$("#cc").onclick=()=>{cart=[];render()};
 V.querySelectorAll("[data-cx]").forEach(i=>i.onchange=()=>{const c=cart.find(x=>x.m===+i.dataset.cx);c.qp=Math.max(0,Math.floor(+i.value)||0);if(c.qp&&c.q>c.qp)toast("Quantité vendue supérieure à la prescrite.")});
 if($("#pt")){$("#pt").oninput=e=>{cartPt=e.target.value};$("#pm").onchange=e=>{cartPm=e.target.value}}
 V.querySelectorAll("[data-s]").forEach(r=>r.onclick=()=>receipt(S.sales.find(s=>s.id===+r.dataset.s)));
 V.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>adjLot(S.lots.find(l=>l.id===+b.dataset.j)));
 if($("#gr"))$("#gr").onclick=()=>{tab="rep";repDay=td(new Date());render()};
 if($("#un")){$("#un").onclick=()=>userForm();$("#ub").onclick=()=>{tab="more";render()};V.querySelectorAll("[data-ue]").forEach(b=>b.onclick=()=>userForm(S.users.find(u=>u.id===+b.dataset.ue)));V.querySelectorAll("[data-ua]").forEach(b=>b.onclick=()=>{hu=S.users.find(u=>u.id===+b.dataset.ua).n;hd1=hd2=hf=hm="";tab="hist";render()})}
 if($("#h1")){$("#h1").onchange=e=>{hd1=e.target.value;render()};$("#h2").onchange=e=>{hd2=e.target.value;render()};$("#hm").onchange=e=>{hm=e.target.value;render()};if($("#hu"))$("#hu").onchange=e=>{hu=e.target.value;render()}}
 if($("#rd")){$("#rd").onchange=e=>{repDay=e.target.value||td(new Date());render()};$("#hb2").onclick=()=>{tab="more";render()};
  if($("#ae"))$("#ae").onclick=expForm;if($("#cj"))$("#cj").onclick=()=>closeDay(repDay);if($("#ro"))$("#ro").onclick=()=>reopen2(repDay);
  $("#rp").onclick=()=>printEl(`<h2>${esc(S.ph)} — Rapport du ${repDay}</h2>`+$("#rb").innerHTML);
  $("#rw").href="https://wa.me/?text="+encodeURIComponent(S.ph+" — Rapport du "+repDay+"\n"+$("#rb").innerText);
  V.querySelectorAll("[data-d]").forEach(r=>r.onclick=()=>{repDay=r.dataset.d;render();scrollTo(0,0)})}
 if($("#cv"))$("#cv").onclick=()=>{const e=sell();if(e)toast(e);else toast("Vente enregistrée.");render()};
 if($("#hf")){$("#hf").onchange=e=>{hf=e.target.value;render()};$("#hb").onclick=()=>{tab="more";render()}}
 V.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>outForm(S.lots.find(l=>l.id===+b.dataset.o)));
 V.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{if(!need("stock"))return;if(confirm("Retirer ce lot expiré du stock ?")){const l=S.lots.find(x=>x.id===+b.dataset.r);S.lots=S.lots.filter(x=>x.id!==+b.dataset.r);if(l)log("Retrait",`Lot expiré retiré : ${med(l.m)?.n} — lot ${l.no}, ${l.q} u.`,{m:(med(l.m)?.n||"")+" "+(med(l.m)?.dos||""),q:l.q,v:l.q*l.c});save();render()}});
 if(tab==="more"){
  $("#hh").onclick=()=>{tab="hist";render()};$("#hr").onclick=()=>{tab="rep";repDay=td(new Date());render()};
  $("#mp").onclick=pwForm;$("#lo").onclick=logout;if($("#ug"))$("#ug").onclick=()=>{tab="usr";render()};$("#cx").onclick=exportCSV;$("#ci").onclick=importCSV;$("#cd").onclick=loadDemo;$("#rn").onclick=purgeDemo;
  $("#sv").onclick=()=>{if(!need("admin"))return;const a=$("#ph").value.trim(),b=$("#us").value.trim();if(!a||!b)return toast("Renseignez les deux noms.");if(a!==S.ph||b!==S.user)log("Modification",`Paramètres : pharmacie « ${a} », utilisateur « ${b} »`);S.ph=a;S.user=b;save();toast("Enregistré.")};$("#pn").onclick=()=>need("admin")&&pinSetup();if($("#pd"))$("#pd").onclick=()=>need("admin")&&pinOff();
  $("#sr").onclick=()=>{if(!need("admin"))return;const r=+$("#rate").value;if(r>0){log("Modification",`Taux de change : ${S.rate} → ${r} FC pour 1 USD`);S.rate=r;save();alert("Taux enregistré.")}else alert("Taux invalide.")};
  $("#bk").onclick=async()=>{if(!need("admin"))return;try{await navigator.clipboard.writeText(JSON.stringify(S));alert("Sauvegarde copiée. Collez-la dans une note ou un message à vous-même.")}catch(e){prompt("Copiez cette sauvegarde :",JSON.stringify(S))}};
  $("#rs").onclick=()=>{if(!need("admin"))return;const t=prompt("Collez votre sauvegarde :");if(!t)return;try{const o=JSON.parse(t);if(!o.meds||!o.lots)throw 0;o.sales=o.sales||[];o.log=o.log||[];o.exp=o.exp||[];o.clos=o.clos||{};o.user=o.user||S.user;o.ph=o.ph||S.ph;o.users=S.users;o.pin=S.pin;o.pinLen=S.pinLen;S=o;log("Sauvegarde","Données restaurées depuis une sauvegarde");save();render()}catch(e){alert("Sauvegarde invalide.")}};
  $("#rz").onclick=()=>{if(confirm("Remplacer toutes les données (stock et ventes) par la démonstration ? Action irréversible.")){const p=S.pin,pl=S.pinLen,lg=S.log,cl=S.clos,us=S.user,ph=S.ph,sq=S.seq;S=demo();S.sales=[];S.exp=[];S.clos=cl||{};S.user=us;S.ph=ph;S.seq=sq;S.log=lg;S.pin=p;S.pinLen=pl;log("Sauvegarde","Données de démonstration rechargées");save();render()}};
 }
}
lock();render();boot();
